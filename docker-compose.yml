services:

  mongodb:
    image: mongo:8
    container_name: coderestapi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: coderestapi-api
    ports:
      - "8080:8080"
    depends_on:
      - mongodb

volumes:
  mongodb_data: